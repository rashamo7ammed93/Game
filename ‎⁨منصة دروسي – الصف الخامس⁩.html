{id:"p",n:"النصوص الشعرية",c:"var(--c3)",L:[
{t:"قصيدة جدتي",v:"",b:[
 {h:"الفكرة العامة",p:"دور الجدة ومكانتها في حياة الأحفاد والأبناء."},
 {h:"حنان الجدة في تعاملها مع الحفيد",v:["لي جَدَّةٌ تَرأَفُ بي    أَحنى عَلَيَّ مِن أَبي","وَكُلُّ شَيءٍ سَرَّني    تَذهَبُ فيهِ مَذهَبي","إِن غَضِبَ الأَهلُ عَلَيَّ كُلُّهُم    لَم تَغضَبِ"],p:"يتحدث الشاعر عن نفسه، فيقول إن جدته ترحمه وتعطف عليه وتحنو عليه أكثر من أبيه. ويبيّن مدى سعادتها ورضاها، فكل شيء يسعده يسعدها أيضًا، فهي راضية مسرورة ما دام طفلها مسرورًا. وإذا غضب الأهل جميعًا على الطفل فإن الجدة هي الوحيدة التي تحنو عليه ولا تغضب منه."},
 {h:"غضب الأب وتهديده لابنه بالضرب",v:["مَشى أَبي يَوماً إِلَيَّ    مِشيَةَ المُؤَدِّبِ","غَضبانَ قَد هَدَّدَ بِالضَّربِ    وَإِن لَم يَضرِبِ"],p:"يبيّن الشاعر حال أبيه عندما أقبل عليه غاضبًا يريد تأديبه، وقد هدده بالضرب على فعلته."},
 {h:"الجدة هي ملاذ الحفيد",v:["فَلَم أَجِد لِيَ مِنهُ غَيرَ جَدَّتي مِن مَهرَبِ","فَجَعَلَتني خَلفَها    أَنجو بِها وَأَختَبي","وَهيَ تَقولُ لِأَبي    بِلَهجَةِ المُؤَنِّبِ","وَيحٌ لَهُ وَيحٌ لِهَذا الوَلَدِ المُعَذَّبِ","أَلَم تَكُن تَصنَعُ ما    يَصنَعُ إِذا أَنتَ صَبي؟"],p:"لجأ الطفل إلى جدته ووجد فيها الأمان، فاحتمى بها من غضب أبيه وعقابه. فبدأت الجدة تؤنب الأب وتوبخه محاولةً منعه من ضرب ابنه، وأقنعته بأن الطفل صغير السن لا حاجة إلى ترويعه وتخويفه. وتذكّر الأب بشقاوته وحاله حين كان صبيًّا صغيرًا، بصيغة السؤال حتى يتراجع عن تأديب ابنه."},
 {h:"معاني الكلمات",ul:["ترأف: الرحمة والعطف","أحنى: حنونة، أكثر حنانًا","مذهبي: توافقني الرأي","أنجو بها: تساعدني في حل هذه المشكلة","المؤنِّب: الموبّخ، الذي يلومه على فعلته","ويحٌ له: ويلٌ له"]}],

    ["أيُّ الأبيات الآتية يدل على أن الطفل وجد الأمان عند جدته؟",["مَشى أَبي يَوماً إِلَيَّ مِشيَةَ المُؤَدِّبِ","فَجَعَلَتني خَلفَها أَنجو بِها وَأَختَبي","وَكُلُّ شَيءٍ سَرَّني تَذهَبُ فيهِ مَذهَبي"],1,"احتمى الطفل خلف جدته من غضب أبيه، فهي مصدر الأمان عنده."],["أكملي البيت: لي جَدَّةٌ تَرأَفُ بي أَحنى عَلَيَّ مِن ____",["أَبي","أُمّي","أَخي"],0,"تمام البيت: «أحنى عليَّ من أبي».","f"],["صواب أم خطأ؟ يذكر الشاعر أن جدته تغضب عليه إذا غضب الأهل.",["صواب","خطأ"],1,"يقول الشاعر: «إن غضب الأهل عليَّ كلهم لم تغضبِ».","t"],["رتّبي كلمات الشطر الشعري:",["فَجَعَلَتني","خَلفَها","أَنجو","بِها","وَأَختَبي"],0,"هذا هو الشطر كما ورد في القصيدة.","o"]]},
{t:"دعوة إلى الإخاء",v:"",b:[
 {h:"الفكرة العامة",p:"دعوة الشاعر الناس إلى التحاب والتضامن وترك الكراهية والأحقاد."},
 {h:"علاقة الإنسان بالإنسان كما يراها الشاعر",v:["أنتَ إنسانٌ وإنسانٌ أنا    فلماذا نحنُ خصمانِ هنا؟","فلماذا؟","تنبتُ الأرضُ لنا أزهارَها    ثمَّ لا ننبتُها إلا قَنا","أرضُنا إنْ شئتَ تغدو مسكنًا    وإنْ شئتَ استحالتْ مدفنًا"],p:"يخاطب الشاعر المتلقي ويسأله: أنت إنسان وأنا إنسان، فنحن متشابهان ومتساويان، فلماذا نعيش في خصام وعداوة؟ ومع أن الأرض تنبت الأزهار، رمز الحياة والجمال والسلم، فإن الإنسان يقابل هذه النعم بنشر القتل والموت عبر الأسلحة والحرب. ومصير الأرض مرتبط بمشيئة الإنسان، فبإرادته يجعلها مسكنًا أي موطنًا للحياة، وبيده يحوّلها مدفنًا أي مقبرة ومكانًا للموت."},
 {h:"إصرار الشاعر على الدعوة إلى التآخي",v:["أيُّها السائلُ عني: مَنْ أنا؟    أنا ذوبُ الحبِّ طيبًا وجنى","سأناديكَ ولو ضاعَ الصدى    وأدقُّ البابَ حتى تأذنا","كنْ كما شئتَ وخالفْ فكرتي    لن تراني حاقدًا مضطغنا"],p:"يتحدث الشاعر عن نفسه فيقول لمن يسأل عنه إنه إنسان يتحلى بالحب والخير والعطاء. وسيستمر في دعوة الآخر إلى الأخوة ولو كان ندائي مجرد صدى، وسيبقي باب الصداقة مفتوحًا حتى يأذن له بالدخول إلى عالمه ويقبل أخوته وصداقته. ويتقبّل المخالف له في الرأي ولن يكون حاقدًا ولا كارهًا له."},
 {h:"الدعوة إلى عدم التمييز بين الناس",v:["موطني الإنسانُ لا لونَ لهُ    فاجعلِ الإنسانَ مثلي موطنا","إنْ زرعنا البغضَ يأكلنا معًا    إنْ غرسنا الحبَّ يزهرْ حولنا"],p:"يبيّن الشاعر أن موطنه هو الإنسان نفسه، نافيًا التمييز بين البشر على أساس اللون، وداعيًا الناس إلى العمل بأفكاره من أجل خير الإنسانية. ويختتم قصيدته بربط كل فعل بنتيجته، فالكره عاقبته الموت وفناء الإنسانية، أما الحب فنتيجته انتشار المحبة والإخاء بين الناس."},
 {h:"معاني الكلمات والأساليب",ul:["قنا: رماح","استحالت: تحولت","مدفنًا: مقبرة","ذوب: عسل","جنى: الثمار","الصدى: تردد الصوت","مضطغنًا: حاقدًا","البغض: الكره","فلماذا نحن خصمانِ هنا؟ أسلوب استفهام","أيها: أسلوب نداء، ومن أنا: أسلوب استفهام","كنْ: أسلوب أمر، ولن تراني: أسلوب نفي","فاجعلِ الإنسانَ: أسلوب أمر"]}],

{t:"البحرين تتكلم",v:"",b:[
 {h:"الفكرة العامة",p:"فخر الشاعر واعتزازه بماضي البحرين العريق وحاضرها الزاهي."},
 {h:"اعتزاز البحرين بمكانتها العالية",v:["أنا البحرينُ سلْ عني الليالي    تُجبكَ بما تسرُّ به المعالي"],p:"يتحدث الشاعر عن البحرين بفخر واعتزاز بمكانتها، فيقول: إذا أردت أن تعرف من هي البحرين فاسأل الأيام السالفة والليالي الماضية، وستأتيك إجابة تفرحك لأنها صاحبة رفعة وشرف."},
 {h:"ثروات البحرين وخيراتها المتنوعة في برها وبحرها",v:["بي البترولُ والهضباتُ جارٍ    وفي بحري الثمينُ من اللآلي","ونخلي في الشواطئ كالعذارى    يغني للسعادة والجمال","ومن سحرِ الطبيعةِ في سهولي    تناثرتِ الزهورُ على الرمالِ","وأشرعتي تبارتْ في الطوامي    تسيرُ من الجنوبِ إلى الشمالِ","تسيرُ على الخليجِ بكلِّ أفقٍ    كأجنحةِ الحمائمِ بالتتالي"],p:"يفتخر الشاعر بأن البحرين كانت ولا تزال أرضًا غنية بالنفط، وبأن في بحرها الثمين اللؤلؤ النادر. ويفخر بكثرة النخيل فيها، وكانت تسمى «بلد المليون نخلة»، وهذه النخيل الجميلة تشبه الفتيات غير المتزوجات اللواتي يغنين فرحًا بجمال الشواطئ. ومن جمال طبيعتها كثرة الزهور المنتشرة في أراضيها المنبسطة. ويصف السفن في وسط البحار تسير بأشرعتها البيضاء في كل اتجاه كأنها تتنافس، وكأنها حمائم تطير في السماء."},
 {h:"فخر البحرين بماضيها المجيد وحاضرها السعيد",v:["أنا قد كنتُ في الماضي منارًا    يطلُّ من الخليجِ إلى الأعالي","وها أنا حاضرٌ زاهٍ سعيدٌ    يسيرُ من الكمالِ إلى الكمالِ"],p:"يعتز الشاعر بماضي البحرين العريق وتاريخها المجيد، فقد كانت موضع نور وعلامة واضحة يسترشد بها الآخرون. ويختتم قصيدته بحاضرها السعيد ومستقبلها المشرق، يمضي من تقدم إلى تقدم نحو الكمال والازدهار."},

 var b=el("button","",s.n);b.setAttribute("role","tab");b.setAttribute("aria-selected",i===cur?"true":"false");b.style.setProperty("--tc",s.c);
 b.onclick=function(){cur=i;li=0;show()};n.appendChild(b)});}

 var kids=n.children;for(var i=0;i<kids.length;i++)kids[i].setAttribute("aria-selected",i===cur?"true":"false");

  b.setAttribute("aria-current",i===li?"true":"false");b.onclick=function(){li=i;show()};list.appendChild(b)});
 lesson(s.L[li]);}

 L.b.forEach(function(k){var d=el("div","blk");d.appendChild(el("h3","",k.h));

  if(k.ul){var u=el("ul");k.ul.forEach(function(x){u.appendChild(el("li","",x))});d.appendChild(u)}
  if(k.chips){var c=el("div","chips");k.chips.forEach(function(x){c.appendChild(el("b","",x))});d.appendChild(c)}
  v.appendChild(d)});
 v.appendChild(el("h3","","أنشطة الدرس"));
 var done=0,right=0,sc=el("p","sc","");

  q[1].forEach(function(t,i){var b=el("button","",t);b.onclick=function(){if(got)return;got=true;done++;
   var ok=i===q[2];if(ok)right++;b.className=ok?"ok":"no";if(q[4]==="f")qp.textContent=q[0].replace("____",q[1][q[2]]);
   if(!ok)o.children[q[2]].className="ok";
   fb.className="fb "+(ok?"ok":"no");fb.textContent=(ok?"أحسنتِ! ":"حاولي مرة أخرى في المرة القادمة. ")+q[3];
   if(done===L.a.length)sc.textContent="نتيجتكِ: "+right+" من "+L.a.length;};o.appendChild(b)});
  d.appendChild(o);d.appendChild(fb);v.appendChild(d)});
 v.appendChild(sc);
 var again=el("button","btn","أعيدي الأنشطة");again.onclick=function(){lesson(L)};v.appendChild(again);}
function orderQ(q,d,fb,o,cb){var w=q[1],got=[],line=el("div","vs","");line.style.minHeight="2.4em";d.appendChild(line);
 w.map(function(_,i){return i}).reverse().forEach(function(i){var b=el("button","",w[i]);b.onclick=function(){if(got.length===w.length)return;b.disabled=true;got.push(i);line.textContent=got.map(function(k){return w[k]}).join(" ");
  if(got.length===w.length){var ok=got.every(function(k,j){return k===j});fb.className="fb "+(ok?"ok":"no");fb.textContent=(ok?"أحسنتِ! ":"الترتيب الصحيح: "+w.join(" ")+". ")+q[3];cb(ok)}};o.appendChild(b)});
 d.appendChild(o);d.appendChild(fb)}

 if(GAMES_URL){var a=el("a","btn","ابدئي اللعب");a.href=GAMES_URL;a.target="_blank";a.rel="noopener";a.style.alignSelf="flex-start";d.appendChild(a)}else d.appendChild(el("span","","الرابط غير مضاف بعد."));g.appendChild(d)})}
